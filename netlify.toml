"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build && node scripts/check-source-imports.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self' https://engaged-emea.jll.com https://residential.jll.co.uk"

[[headers]]
  for = "/release.json"
  [headers.values]
    Cache-Control = "no-store"

[[plugins]]
  package = "./netlify/plugins/prepare-pending-input"
